module_name: Terraform AWS Service Delegation Module
module_description: The Terraform wrapper for AWS service delegation simplifies registering delegated administrator and organization-administrator accounts for CloudTrail, GuardDuty, and Security Hub from your AWS Organizations management account. This wrapper is a small, opinionated template so you do not have to wire those provider resources yourself. Supply settings through the `service_delegation_parameters` map (see `input_table`). It follows the same GoCloud `metadata` convention as other wrappers even though it does not apply tags to AWS resources.
